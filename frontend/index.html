<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const stored = localStorage.getItem('techit-theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const effective = stored === 'light' ? 'light' : stored === 'dark' ? 'dark' : (systemDark ? 'dark' : 'light');
        document.documentElement.classList.add(effective);
      })();
    </script>
    <link rel="icon" type="image/png" href="/TechIT-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechIT | No Idea should be lost</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
