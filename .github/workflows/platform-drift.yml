name: TECHIT Platform — Drift and readiness check

on:
  schedule:
    # Every 6 hours. Compares deployed build identity to the default branch SHA
    # and probes readiness on all three services plus the payment gateway.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Probe production services
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: https://beta.techitnetwork.com
      VITE_API_URL: https://backend.techitnetwork.com/api
      VITE_TECHIT_API: https://backend.techitnetwork.com/api/mcp
      VITE_API_BASE_URL: https://api.techitnetwork.com
      VITE_MESSAGING_BASE_URL: https://messaging.techitnetwork.com
      VITE_PAYMENT_GATEWAY_URL: ${{ vars.PAYMENT_GATEWAY_URL }}
      SMOKE_TIMEOUT_MS: "10000"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Resolve each service's source-of-truth SHA
        run: |
          # Compare every service against its OWN repository's main head. The
          # repos are public, so no token is needed; a failed lookup leaves the
          # value unset and degrades that service to log-only.
          resolve() {
            curl -fsS "https://api.github.com/repos/$1/commits/main" 2>/dev/null | jq -r '.sha // empty' || true
          }
          BACKEND_SHA="$(resolve techit360ai-bit/BACKEND)"
          AI_ROUTER_SHA="$(resolve techit360ai-bit/ai-router)"
          {
            echo "SMOKE_EXPECT_SHA_NODE_BACKEND=$BACKEND_SHA"
            echo "SMOKE_EXPECT_SHA_MESSAGING=$BACKEND_SHA"
            echo "SMOKE_EXPECT_SHA_AI_ROUTER=$AI_ROUTER_SHA"
          } >> "$GITHUB_ENV"
          echo "platform SHAs -> backend/messaging=$BACKEND_SHA ai-router=$AI_ROUTER_SHA"

      - name: Health + deployed build identity (enforced)
        run: node frontend/scripts/smoke.mjs

      - name: Readiness (advisory until AWS origin/URL env is finalized)
        continue-on-error: true
        env:
          SMOKE_REQUIRE_READY: "1"
        run: node frontend/scripts/smoke.mjs
