name: Dependency Assurance

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "47 3 * * 1"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependabot-policy:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Block major and high-risk automatic updates
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          if [[ "$UPDATE_TYPE" == version-update:semver-major ]]; then
            echo "Major dependency updates require an engineer-led migration PR."
            exit 1
          fi
          if [[ "$DEPENDENCY_NAMES" =~ (react|react-dom|eslint-plugin-react-hooks|vite|typescript|axios) ]]; then
            echo "High-risk frontend/runtime dependencies require manual review."
            exit 1
          fi

  dependency-review:
    # dependency-review-action requires GitHub Advanced Security on private
    # repos (the dependency-graph compare API returns 403 without it). Skipping
    # the job on private repos silently disabled the gate where the sensitive
    # code lives, so private repos now run an equivalent lockfile-integrity gate
    # here while the npm-audit job below enforces the vulnerability gate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7
        if: github.event.repository.private == true
        with:
          node-version: "22"
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event.repository.private == false
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only,AGPL-3.0-only
      - name: Private-repo dependency gate (GHAS substitute)
        if: github.event.repository.private == true
        run: |
          # Fails closed on a missing, malformed, or out-of-sync lockfile, which
          # is what silently broke this workflow on main.
          npm ci --prefix frontend --dry-run --ignore-scripts --no-audit --no-fund

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Audit for new high/critical findings
        run: |
          npm audit --prefix frontend --audit-level=high --omit=dev --json > /tmp/npm-audit.json || true
          test -s /tmp/npm-audit.json
          node .github/scripts/npm-audit-regression.mjs
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: frontend
          artifact-name: frontend-sbom.spdx.json

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
