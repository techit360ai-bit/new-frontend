name: Dependency Assurance

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "47 3 * * 1"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  dependabot-policy:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Block major and high-risk automatic updates
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          if [[ "$UPDATE_TYPE" == version-update:semver-major ]]; then
            echo "Major dependency updates require an engineer-led migration PR."
            exit 1
          fi
          if [[ "$DEPENDENCY_NAMES" =~ (react|react-dom|eslint-plugin-react-hooks|vite|typescript|axios) ]]; then
            echo "High-risk frontend/runtime dependencies require manual review."
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only,AGPL-3.0-only

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Audit for new high/critical findings
        run: |
          npm audit --prefix frontend --audit-level=high --omit=dev --json > /tmp/npm-audit.json || true
          node .github/scripts/npm-audit-regression.mjs
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: frontend
          artifact-name: frontend-sbom.spdx.json

  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
