name: frontend-security-policy

on:
  pull_request:
  push:
    branches: [main, master, feat/tvce-value-conversion-complete]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: test -f ../docs/SECURITY_CHANGE_PROTOCOL.md
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev
      - name: Secret pattern gate
        run: '! git grep -nE "(sk-[A-Za-z0-9_-]{20,}|-----BEGIN .*PRIVATE KEY-----|AKIA[0-9A-Z]{16})" -- frontend/src frontend/public'
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
