name: frontend-security-policy

on:
  pull_request:
  push:
    branches: [main, master, feat/tvce-value-conversion-complete]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: test -f ../docs/SECURITY_CHANGE_PROTOCOL.md
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
