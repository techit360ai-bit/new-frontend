name: TECHIT Frontend - Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript and Vite production build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: https://techit-api-u1ek.onrender.com/api
          VITE_API_BASE_URL: https://techit-ai-router.onrender.com
          VITE_TECHIT_API: https://techit-api-u1ek.onrender.com/api/mcp
          VITE_MESSAGING_BASE_URL: https://techit-messaging.onrender.com
          VITE_MESSAGING_WS_URL: wss://techit-messaging.onrender.com/ws

      - name: Lint
        run: cd frontend && npm run lint

      - name: Vitest
        run: cd frontend && npm test

      - name: Local test harness
        run: cd frontend && npm run test:local

  deploy:
    name: Deploy Frontend to Render
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "Frontend deploy triggered"
