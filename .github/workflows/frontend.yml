name: TECHIT Frontend - Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Validate release candidate signoff
        run: node scripts/validate-release-candidate.mjs

      - name: Validate frontend env contract
        run: cd frontend && npm run env:check
        env:
          NODE_ENV: production
          VITE_API_URL: https://techit-backend.onrender.com/api
          VITE_API_BASE_URL: https://techit-api-u1ek.onrender.com
          VITE_TECHIT_API: https://techit-backend.onrender.com/api/mcp
          VITE_MESSAGING_BASE_URL: https://techit-messaging.onrender.com
          VITE_MESSAGING_WS_URL: wss://techit-messaging.onrender.com/ws
          VITE_API_STRICT: "1"

      - name: Validate frontend workflow env parity
        run: cd frontend && npm run workflow:check

      - name: Validate release journey coverage
        run: cd frontend && npm run release:journeys

      - name: Validate scalability smoke contract
        run: cd frontend && npm run scalability:check

      - name: TypeScript and Vite production build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: https://techit-backend.onrender.com/api
          VITE_API_BASE_URL: https://techit-api-u1ek.onrender.com
          VITE_TECHIT_API: https://techit-backend.onrender.com/api/mcp
          VITE_MESSAGING_BASE_URL: https://techit-messaging.onrender.com
          VITE_MESSAGING_WS_URL: wss://techit-messaging.onrender.com/ws
          VITE_API_STRICT: "1"

      - name: Audit production live-data sources
        run: cd frontend && npm run live-data:audit

      - name: Lint
        run: cd frontend && npm run lint

      - name: Vitest
        run: cd frontend && npm test

      - name: Local test harness
        run: cd frontend && npm run test:local

  webcontainer-runtime:
    name: Live WebContainer Runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Execute a real Node test and preview inside WebContainer
        run: cd frontend && npx playwright test tests/visual/code-editor.spec.ts --grep "boots a real WebContainer"
        env:
          TECHIT_LIVE_WEBCONTAINER: "1"

  deploy:
    name: Deploy Frontend to Render
    runs-on: ubuntu-latest
    needs: [quality, webcontainer-runtime]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RENDER_FRONTEND_DEPLOY_ENABLED == 'true'
    steps:
      - name: Verify merged PR provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          case "$COMMIT_MESSAGE" in Merge\ pull\ request\ \#*) exit 0;; esac
          count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select(.merged_at != null)] | length')"
          test "$count" -gt 0

      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "Frontend deploy triggered"
