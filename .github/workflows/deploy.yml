name: TECHIT Frontend — Build and Deploy to S3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Vite production build
        run: cd frontend && npm run build
        env:
          VITE_API_URL: https://backend.techitnetwork.com/api
          VITE_API_BASE_URL: https://api.techitnetwork.com
          VITE_TECHIT_API: https://backend.techitnetwork.com/api/mcp
          VITE_MESSAGING_BASE_URL: https://messaging.techitnetwork.com
          VITE_MESSAGING_WS_URL: wss://messaging.techitnetwork.com/ws
          VITE_TRUST_AUTHORITY_URL: https://backend.techitnetwork.com/api
          VITE_API_STRICT: "1"

      - name: Deploy to S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 sync frontend/dist s3://${{ secrets.FRONTEND_S3_BUCKET }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp frontend/dist/index.html s3://${{ secrets.FRONTEND_S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.FRONTEND_CF_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "✅ Frontend deployed and cache invalidated"

      - name: Resolve platform source-of-truth SHAs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Each service is compared with its OWN repository's main head, not the
          # frontend commit — node-backend and messaging ship from BACKEND and
          # ai-router ships from ai-router. All repos are public, so the
          # unauthenticated API suffices; if a lookup fails the value stays unset
          # and that service degrades to log-only instead of a false drift fail.
          resolve() {
            curl -fsS "https://api.github.com/repos/$1/commits/main" 2>/dev/null | jq -r '.sha // empty' || true
          }
          BACKEND_SHA="$(resolve techit360ai-bit/BACKEND)"
          AI_ROUTER_SHA="$(resolve techit360ai-bit/ai-router)"
          {
            echo "SMOKE_EXPECT_SHA_NODE_BACKEND=$BACKEND_SHA"
            echo "SMOKE_EXPECT_SHA_MESSAGING=$BACKEND_SHA"
            echo "SMOKE_EXPECT_SHA_AI_ROUTER=$AI_ROUTER_SHA"
          } >> "$GITHUB_ENV"
          echo "platform SHAs -> backend/messaging=$BACKEND_SHA ai-router=$AI_ROUTER_SHA"

      - name: Post-deploy platform smoke (health + build identity)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          FRONTEND_URL: https://beta.techitnetwork.com
          VITE_API_URL: https://backend.techitnetwork.com/api
          VITE_TECHIT_API: https://backend.techitnetwork.com/api/mcp
          VITE_API_BASE_URL: https://api.techitnetwork.com
          VITE_MESSAGING_BASE_URL: https://messaging.techitnetwork.com
          VITE_PAYMENT_GATEWAY_URL: ${{ vars.PAYMENT_GATEWAY_URL }}
          SMOKE_TIMEOUT_MS: "10000"
        run: node frontend/scripts/smoke.mjs

      - name: Post-deploy readiness (advisory until AWS env finalized)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          FRONTEND_URL: https://beta.techitnetwork.com
          VITE_API_URL: https://backend.techitnetwork.com/api
          VITE_TECHIT_API: https://backend.techitnetwork.com/api/mcp
          VITE_API_BASE_URL: https://api.techitnetwork.com
          VITE_MESSAGING_BASE_URL: https://messaging.techitnetwork.com
          VITE_PAYMENT_GATEWAY_URL: ${{ vars.PAYMENT_GATEWAY_URL }}
          SMOKE_REQUIRE_READY: "1"
          SMOKE_TIMEOUT_MS: "10000"
        run: node frontend/scripts/smoke.mjs
