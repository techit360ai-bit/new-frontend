name: TECHIT Active Frontend — Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Vite Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Vite production build
        run: cd frontend && npx vite build
        env:
          VITE_API_URL: https://techit-backend.onrender.com/api
          VITE_API_BASE_URL: https://techit-api-u1ek.onrender.com
          VITE_TECHIT_API: https://techit-backend.onrender.com/api/mcp
          VITE_MESSAGING_BASE_URL: https://techit-messaging.onrender.com
          VITE_MESSAGING_WS_URL: wss://techit-messaging.onrender.com/ws
          VITE_API_STRICT: "1"

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.RENDER_FRONTEND_DEPLOY_ENABLED == 'true'
    steps:
      - name: Verify merged PR provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" =~ ^Merge pull request #[0-9]+ ]]; then exit 0; fi
          count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '[.[] | select(.merged_at != null)] | length')"
          test "$count" -gt 0

      - name: Trigger Render deploy
        run: |
          curl -s -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "✅ Frontend deploy triggered"
